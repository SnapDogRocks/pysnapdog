# The only automatic route by which a production tag comes about.
name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    # Per the non-negotiable rule the app credentials live exclusively in this
    # environment. Without the declaration they are invisible to the job.
    environment: release
    steps:
      # The release pull request MUST be created with an app token. GitHub
      # suppresses workflow triggers from GITHUB_TOKEN pushes as recursion
      # protection; CI would then never run on the release pull request and the
      # required checks would stay pending. An app token is a genuine actor.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release Please raises the version in pyproject.toml, and its toml updater leaves the entry
      # of this project in uv.lock alone, so `uv sync --locked` fails on the release pull request.
      # The commit is pushed with the app token, so the checks run on it like on any other push.
      - name: Check out the release pull request
        if: steps.rp.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The branch Release Please keeps for this package, a fixed name and not an output.
          ref: release-please--branches--main--components--pysnapdog
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up uv
        if: steps.rp.outputs.prs_created == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Keep uv.lock in step with the release version
        if: steps.rp.outputs.prs_created == 'true'
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with the release version"
          git push

      # Hand the draft release to the publish workflow. The tag exists (force-tag-creation).
      - name: Start the release workflow
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
